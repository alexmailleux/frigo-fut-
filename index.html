<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Frigo Futé</title>
<meta name="description" content="Frigo Futé — planifiez vos repas, votre liste de courses, et ne gaspillez plus rien grâce aux restes." />
<meta name="theme-color" content="#FF6B5B" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="app">

  <!-- ============================================================ -->
  <!-- Chargement -->
  <!-- ============================================================ -->
  <div v-if="!booted" style="display:flex;align-items:center;justify-content:center;height:100vh;">
    <div style="text-align:center;">
      <div class="logo-dot" style="width:56px;height:56px;border-radius:18px;margin:0 auto 12px;">🍽️</div>
      <p class="text-light">Chargement...</p>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- Écran de connexion (mode Supabase uniquement) -->
  <!-- ============================================================ -->
  <div v-else-if="storeMode === 'supabase' && !session" class="auth-screen">
    <div class="hero">
      <div class="logo-dot">🍽️</div>
      <h1>Frigo Futé</h1>
      <p>Planifiez vos repas et vos courses, à deux.</p>
    </div>

    <div class="auth-tabs">
      <button :class="{active: authMode==='login'}" @click="authMode='login'; authError=''">Connexion</button>
      <button :class="{active: authMode==='signup'}" @click="authMode='signup'; authError=''">Inscription</button>
    </div>

    <div v-if="authError" class="auth-error">{{ authError }}</div>

    <form v-if="authMode==='signup'" @submit.prevent="handleSignUp">
      <div class="field">
        <label class="field-label">Prénom</label>
        <input class="input" v-model="authForm.firstName" required placeholder="Camille" />
      </div>
      <div class="field">
        <label class="field-label">Nom</label>
        <input class="input" v-model="authForm.lastName" required placeholder="Dupont" />
      </div>
      <div class="field">
        <label class="field-label">Date de naissance</label>
        <input class="input" type="date" v-model="authForm.birthdate" />
      </div>
      <div class="field">
        <label class="field-label">Email</label>
        <input class="input" type="email" v-model="authForm.email" required placeholder="camille@email.com" />
      </div>
      <div class="field">
        <label class="field-label">Mot de passe</label>
        <input class="input" type="password" v-model="authForm.password" required minlength="6" placeholder="6 caractères minimum" />
      </div>
      <button class="btn btn-primary btn-block" type="submit" :disabled="authLoading">
        {{ authLoading ? 'Création du compte...' : 'Créer mon compte' }}
      </button>
    </form>

    <form v-else @submit.prevent="handleSignIn">
      <div class="field">
        <label class="field-label">Email</label>
        <input class="input" type="email" v-model="authForm.email" required placeholder="camille@email.com" />
      </div>
      <div class="field">
        <label class="field-label">Mot de passe</label>
        <input class="input" type="password" v-model="authForm.password" required placeholder="••••••••" />
      </div>
      <button class="btn btn-primary btn-block" type="submit" :disabled="authLoading">
        {{ authLoading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <p class="auth-note">Vos identifiants sont gérés par Supabase (hébergement que vous contrôlez).</p>
  </div>

  <!-- ============================================================ -->
  <!-- Application principale -->
  <!-- ============================================================ -->
  <template v-else>

    <header class="app-header">
      <div class="brand"><span class="logo-dot">🍽️</span> Frigo Futé</div>
      <div class="header-right">
        <div class="week-pill">{{ weekSelections.length }} recette{{ weekSelections.length>1?'s':'' }} cette semaine</div>
        <button class="header-account-btn" :class="{active: activeTab==='compte'}" @click="activeTab='compte'" title="Mon compte">👤</button>
      </div>
    </header>

    <main class="app-main">

      <!-- ============================= TAB: RECETTES ============================= -->
      <section v-show="activeTab==='recettes'">

        <input class="input" v-model="recipeSearchQuery" placeholder="🔍 Rechercher une recette par son nom..." />

        <div class="section-title mt-16">
          <h2>Bibliothèque de recettes</h2>
          <span class="count">{{ filteredRecipes.length }}</span>
        </div>

        <div class="filter-chips">
          <div class="chip" :class="{active: showOnlyMine}" @click="showOnlyMine=!showOnlyMine">👩‍🍳 Mes recettes</div>
          <div class="chip" :class="{active: showFridgeOnly}" @click="toggleFridgeOnly">🧊 Frigo</div>
          <div class="chip chip-action" @click="openAddRecipe">➕ Ajouter une recette</div>
        </div>

        <!-- 4 filtres par catégorie, multi-sélectionnables, cumulables -->
        <div class="filter-grid-2x2 mt-8">
          <div class="dropdown-wrap" :style="{zIndex: openDropdown==='protein' ? 60 : 36}">
            <button class="filter-toggle-btn" style="width:100%;" @click="toggleDropdown('protein')">
              🥩 Protéine <span v-if="selectedProteins.length" class="count-badge">{{ selectedProteins.length }}</span>
              <span class="caret">▾</span>
            </button>
            <div v-if="openDropdown==='protein'" class="dropdown-panel">
              <label v-for="p in proteinOptions" :key="p" class="dropdown-option">
                <input type="checkbox" :checked="selectedProteins.includes(p)" @change="toggleFilterValue('selectedProteins', p)" /> {{ p }}
              </label>
              <div v-if="selectedProteins.length > 1" class="filter-chips mt-8">
                <div class="chip" :class="{active: proteinMatchMode==='any'}" @click="toggleMatchMode('proteinMatchMode')">OU</div>
                <div class="chip" :class="{active: proteinMatchMode==='all'}" @click="toggleMatchMode('proteinMatchMode')">ET</div>
              </div>
            </div>
          </div>

          <div class="dropdown-wrap" :style="{zIndex: openDropdown==='origin' ? 60 : 36}">
            <button class="filter-toggle-btn" style="width:100%;" @click="toggleDropdown('origin')">
              🌍 Origine <span v-if="selectedOrigins.length" class="count-badge">{{ selectedOrigins.length }}</span>
              <span class="caret">▾</span>
            </button>
            <div v-if="openDropdown==='origin'" class="dropdown-panel">
              <label v-for="o in originOptions" :key="o" class="dropdown-option">
                <input type="checkbox" :checked="selectedOrigins.includes(o)" @change="toggleFilterValue('selectedOrigins', o)" /> {{ o }}
              </label>
              <div v-if="selectedOrigins.length > 1" class="filter-chips mt-8">
                <div class="chip" :class="{active: originMatchMode==='any'}" @click="toggleMatchMode('originMatchMode')">OU</div>
                <div class="chip" :class="{active: originMatchMode==='all'}" @click="toggleMatchMode('originMatchMode')">ET</div>
              </div>
            </div>
          </div>

          <div class="dropdown-wrap" :style="{zIndex: openDropdown==='mealtype' ? 60 : 36}">
            <button class="filter-toggle-btn" style="width:100%;" @click="toggleDropdown('mealtype')">
              🍽️ Type de repas <span v-if="selectedMealTypes.length" class="count-badge">{{ selectedMealTypes.length }}</span>
              <span class="caret">▾</span>
            </button>
            <div v-if="openDropdown==='mealtype'" class="dropdown-panel">
              <label v-for="m in mealTypeOptions" :key="m" class="dropdown-option">
                <input type="checkbox" :checked="selectedMealTypes.includes(m)" @change="toggleFilterValue('selectedMealTypes', m)" /> {{ m }}
              </label>
              <div v-if="selectedMealTypes.length > 1" class="filter-chips mt-8">
                <div class="chip" :class="{active: mealTypeMatchMode==='any'}" @click="toggleMatchMode('mealTypeMatchMode')">OU</div>
                <div class="chip" :class="{active: mealTypeMatchMode==='all'}" @click="toggleMatchMode('mealTypeMatchMode')">ET</div>
              </div>
            </div>
          </div>

          <div class="dropdown-wrap" :style="{zIndex: openDropdown==='tags' ? 60 : 36}">
            <button class="filter-toggle-btn" style="width:100%;" @click="toggleDropdown('tags')">
              🏷️ Tags <span v-if="selectedTags.length" class="count-badge">{{ selectedTags.length }}</span>
              <span class="caret">▾</span>
            </button>
            <div v-if="openDropdown==='tags'" class="dropdown-panel">
              <label v-for="t in otherTagOptions" :key="t" class="dropdown-option">
                <input type="checkbox" :checked="selectedTags.includes(t)" @change="toggleFilterValue('selectedTags', t)" /> {{ t }}
              </label>
              <div v-if="selectedTags.length > 1" class="filter-chips mt-8">
                <div class="chip" :class="{active: tagsMatchMode==='any'}" @click="toggleMatchMode('tagsMatchMode')">OU</div>
                <div class="chip" :class="{active: tagsMatchMode==='all'}" @click="toggleMatchMode('tagsMatchMode')">ET</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Résumé de toutes les sélections actives, retirables en un tap -->
        <div v-if="activeFilterChips.length" class="filter-chips wrap mt-8">
          <div v-for="chip in activeFilterChips" :key="chip.list + chip.value" class="chip active" style="display:flex;align-items:center;gap:6px;" @click="removeActiveFilterChip(chip)">
            {{ chip.value }} <span style="font-weight:900;">✕</span>
          </div>
        </div>

        <div class="filter-actions-row mt-8">
          <button class="filter-toggle-btn" @click="toggleFiltersOpen">
            ⏱️ Temps & ingrédients <span v-if="activeAdvancedFilterCount" class="count-badge">{{ activeAdvancedFilterCount }}</span>
            <span class="caret">{{ filtersOpen ? '▴' : '▾' }}</span>
          </button>
          <div class="dropdown-wrap" style="flex:1;" :style="{zIndex: openDropdown==='sort' ? 60 : 36}">
            <button class="filter-toggle-btn" style="width:100%;" @click="toggleDropdown('sort')" :disabled="showFridgeOnly">
              ⇅ Trier : {{ showFridgeOnly ? 'Plus d\'ingrédients du Frigo' : ({name:'Nom', duration:'Durée', difficulty:'Difficulté'}[sortBy] || 'Défaut') }}
              <span class="caret">▾</span>
            </button>
            <div v-if="openDropdown==='sort'" class="dropdown-panel">
              <div class="dropdown-option" @click="setSortBy(null)">Par défaut</div>
              <div class="dropdown-option" @click="setSortBy('name')">Nom (A → Z)</div>
              <div class="dropdown-option" @click="setSortBy('duration')">Durée (croissant)</div>
              <div class="dropdown-option" @click="setSortBy('difficulty')">Difficulté (facile → difficile)</div>
            </div>
          </div>
        </div>
        <div v-if="openDropdown" class="dropdown-scrim" @click="closeDropdown"></div>

        <div v-if="filtersOpen" class="filters-block mt-16">
          <div class="filter-label">Temps de préparation</div>
          <div class="range-slider">
            <div class="range-slider-track"></div>
            <div class="range-slider-range" :style="prepRangeStyle"></div>
            <input type="range" min="0" :max="prepSliderMax" step="5" :value="prepMinMinutes" @input="onPrepMinInput" />
            <input type="range" min="0" :max="prepSliderMax" step="5" :value="prepMaxMinutes" @input="onPrepMaxInput" />
          </div>
          <div class="range-slider-labels">
            <span>{{ prepMinMinutes }} min</span>
            <span>{{ prepMaxMinutes >= prepSliderMax ? prepSliderMax + '+ min' : prepMaxMinutes + ' min' }}</span>
          </div>

          <div class="filter-label mt-16">Ingrédients</div>
          <div class="dropdown-wrap" style="z-index:20;">
            <div style="display:flex;gap:6px;">
              <input class="input" v-model="ingredientInput" @keyup.enter="addIngredientFilter" @focus="onIngredientFocus" @blur="onIngredientBlur" placeholder="Ex : chor... → chorizo" />
              <button class="btn btn-secondary btn-sm" @click="addIngredientFilter">+</button>
            </div>
            <div v-if="ingredientInputFocused && ingredientSuggestions.length" class="dropdown-panel">
              <div v-for="s in ingredientSuggestions" :key="s" class="dropdown-option" @mousedown.prevent="selectIngredientSuggestion(s)">
                🔎 {{ s }}
              </div>
            </div>
          </div>
          <div v-if="ingredientFilterList.length" class="filter-chips wrap mt-8">
            <div v-for="(ing,i) in ingredientFilterList" :key="ing" class="chip active" style="display:flex;align-items:center;gap:6px;">
              {{ ing }} <span @click="removeIngredientFilter(i)" style="cursor:pointer;font-weight:900;">✕</span>
            </div>
          </div>
          <div v-if="ingredientFilterList.length > 1" class="filter-chips mt-8">
            <div class="chip" :class="{active: ingredientMatchMode==='any'}" @click="ingredientMatchMode='any'">Au moins un ingrédient</div>
            <div class="chip" :class="{active: ingredientMatchMode==='all'}" @click="ingredientMatchMode='all'">Tous les ingrédients</div>
          </div>

          <button v-if="hasActiveFilters" class="filters-reset mt-16" @click="resetFilters">✕ Réinitialiser les filtres</button>
        </div>

        <div v-if="showFridgeOnly && fridgeTemplateSuggestions.length" class="videfrigo-ribbon mt-16">
          <button class="videfrigo-ribbon-header" @click="toggleVideFrigo">
            <span>💡 Idées vide-frigo ({{ fridgeTemplateSuggestions.length }})</span>
            <span class="chevron" :class="{open: videFrigoOpen}">⌄</span>
          </button>
          <div v-show="videFrigoOpen">
            <p class="text-light" style="font-size:12.5px;margin:8px 0 10px;">
              Pas de recette précise en tête ? Ces classiques anti-gaspi s'adaptent à ce que tu as sous la main.
            </p>
            <div v-for="tpl in fridgeTemplateSuggestions" :key="tpl.id" class="template-idea-item" style="cursor:pointer;" @click="openTemplateDetail(tpl.id)">
              <div class="emoji">{{ tpl.emoji }}</div>
              <div class="item-body">
                <div class="item-name">{{ tpl.title }}</div>
                <div class="item-hint">{{ tpl.method }}</div>
              </div>
              <span style="font-size:18px;color:var(--text-light);">›</span>
            </div>
          </div>
        </div>

        <div class="recipe-grid mt-16">
          <div v-for="(recipe,idx) in filteredRecipes" :key="recipe.id"
               class="recipe-card" :class="{selected: isSelected(recipe.id)}"
               @click="handleCardTap(recipe.id)">
            <div class="thumb" :class="'thumb-' + ((idx % 4) + 1)">
              {{ recipe.emoji }}
              <div v-if="isSelected(recipe.id)" class="check">✓</div>
              <button class="fav-star" :class="{active: isFavorite(recipe.id)}" @click.stop="toggleFavorite(recipe.id)">{{ isFavorite(recipe.id) ? '★' : '☆' }}</button>
            </div>
            <div class="info">
              <h3>{{ recipe.title }}</h3>
              <div class="subtitle">{{ recipe.subtitle }}</div>
              <div class="meta">⏱ {{ recipe.prepMinutes }} min · {{ recipe.difficulty }}</div>
              <div v-if="showFridgeOnly && fridgeMatchCounts[recipe.id]" class="meta" style="color:var(--yellow-dark);font-weight:800;">🧊 {{ fridgeMatchCounts[recipe.id] }} ingrédient{{ fridgeMatchCounts[recipe.id]>1?'s':'' }} du Frigo</div>
            </div>
          </div>

          <div class="recipe-card" style="border:2px dashed var(--border);align-items:center;justify-content:center;display:flex;min-height:170px;" @click="openAddRecipe">
            <div style="text-align:center;color:var(--text-light);padding:14px;">
              <div style="font-size:26px;margin-bottom:6px;">➕</div>
              <div style="font-weight:800;font-size:12.5px;">Ajouter<br/>une recette</div>
            </div>
          </div>
        </div>

        <div v-if="filteredRecipes.length===0 && hasActiveFilters" class="empty-state">
          <span class="emoji">🔍</span>
          <h3>Aucune recette ici</h3>
          <p>Essaie d'autres filtres, ou ajoute la tienne.</p>
          <button class="btn btn-primary mt-16" @click="openAddRecipe">Ajouter une recette</button>
        </div>
      </section>

      <!-- ============================= TAB: MA SEMAINE ============================= -->
      <section v-show="activeTab==='masemaine'">
        <div class="section-title" style="margin-top:0;">
          <h2>Ma semaine</h2>
          <span class="count">{{ weekSelections.length }} recette{{ weekSelections.length>1?'s':'' }}</span>
        </div>

        <div v-if="weekSelections.length===0" class="empty-state">
          <span class="emoji">🗓️</span>
          <h3>Aucune recette prévue</h3>
          <p>Va dans l'onglet Recettes pour en choisir pour la semaine.</p>
          <button class="btn btn-primary mt-16" @click="activeTab='recettes'">Voir les recettes</button>
        </div>

        <ul>
          <li v-for="sel in weekSelections" :key="sel.recipeId" class="list-item" @click="openRecipe(sel.recipeId)" style="cursor:pointer;">
            <div style="font-size:22px;">{{ recipeById(sel.recipeId)?.emoji }}</div>
            <div class="item-body">
              <div class="item-name">{{ recipeById(sel.recipeId)?.title }}</div>
              <div class="item-qty">{{ sel.servings }} portion{{ sel.servings>1?'s':'' }}</div>
            </div>
            <button class="btn btn-secondary btn-sm" @click.stop="markRecipeCooked(sel.recipeId)" title="Déduire les ingrédients du Frigo et retirer de la semaine">🍳 Cuisiné</button>
            <button class="remove-x" @click.stop="quickRemoveFromWeek(sel.recipeId)">✕</button>
          </li>
        </ul>
      </section>

      <!-- ============================= TAB: COURSES ============================= -->
      <section v-show="activeTab==='courses'">
        <div class="section-title" style="margin-top:0;">
          <h2>Liste de courses</h2>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="count">{{ shoppingList.length }} article{{ shoppingList.length>1?'s':'' }}</span>
            <button class="btn btn-secondary btn-sm" @click="shareShoppingList" title="Partager la liste">📤 Partager</button>
          </div>
        </div>

        <div v-if="shoppingList.length===0" class="empty-state">
          <span class="emoji">🛒</span>
          <h3>Liste vide</h3>
          <p>Sélectionne des recettes dans l'onglet Recettes pour remplir ta liste automatiquement.</p>
        </div>

        <div v-for="group in shoppingListGrouped" :key="group.name">
          <div class="list-group-title clickable" @click="toggleCategory(group.name)">
            <span>{{ group.name }} ({{ group.items.length }})</span>
            <span class="chevron">{{ collapsedCategories.includes(group.name) ? '▸' : '▾' }}</span>
          </div>
          <ul v-show="!collapsedCategories.includes(group.name)">
            <li v-for="item in group.items" :key="item.key" class="list-item" :class="{'manual-item': item.isManual}">
              <div class="check-circle" @click="moveToFridge(item)" title="Marquer comme acheté → direction le Frigo">✓</div>
              <div class="item-body">
                <div class="item-name">{{ item.name }}</div>
                <div class="item-qty" v-if="!item.isAuGout && item.buyQty!==null">{{ formatQty(item.buyQty, item.unit) }} <span v-if="item.isOverridden" class="tag tag-teal">modifié</span></div>
                <div class="item-qty" v-else-if="item.isManual">{{ item.buyQty ? formatQty(item.buyQty,item.unit) : 'à préciser' }}</div>
                <div class="item-source" v-if="item.sources && item.sources.length">
                  Pour : {{ uniqueSourceTitles(item.sources) }}
                </div>
                <div class="item-source" v-else-if="item.isManual">Ajouté manuellement</div>
              </div>
              <button class="edit-item-btn" @click="item.isManual ? openManualEdit(item) : openQtyEdit(item)" title="Modifier">✏️</button>
              <button class="remove-x" @click="requestRemove(item)">✕</button>
            </li>
          </ul>
        </div>

        <div class="list-bottom-spacer"></div>

        <div class="add-item-bar">
          <input class="input" v-model="newItemName" @keyup.enter="addManualItem" placeholder="Ajouter un article (ex: papier essuie-tout)" />
          <button class="btn btn-secondary" @click="addManualItem">+</button>
        </div>
      </section>

      <!-- ============================= TAB: FRIGO ============================= -->
      <section v-show="activeTab==='frigo'">
        <div class="section-title" style="margin-top:0;">
          <h2>Contenu du Frigo</h2>
          <span class="count">{{ fridgeItemsList.length }}</span>
        </div>
        <p class="text-light" style="font-size:13px;margin-bottom:16px;">
          Le stock réel de ce qu'il te reste. Ça se remplit automatiquement quand tu coches un article acheté dans les Courses, et ça se vide quand tu marques une recette "🍳 Cuisiné" dans Ma semaine.
        </p>

        <div v-if="fridgeItemsList.length===0" class="empty-state">
          <span class="emoji">🧊</span>
          <h3>Frigo vide</h3>
          <p>Coche des articles achetés dans l'onglet Courses pour qu'ils apparaissent ici.</p>
        </div>

        <div v-for="group in fridgeGrouped" :key="group.name">
          <div class="list-group-title">
            <span>{{ group.name }} ({{ group.items.length }})</span>
          </div>
          <ul>
            <li v-for="item in group.items" :key="item.key" class="list-item">
              <div class="item-body">
                <div class="item-name">{{ item.name }}</div>
                <div class="item-qty">{{ item.unit ? formatQty(item.qty, item.unit) : item.qty }}</div>
              </div>
              <button class="edit-item-btn" @click="openFridgeEdit(item)" title="Modifier nom / unité / quantité">✏️</button>
              <button class="remove-x" @click="removeFridgeItemAction(item.key)" title="Retirer (utilisé ou jeté en dehors de l'app)">✕</button>
            </li>
          </ul>
        </div>

        <div class="list-bottom-spacer"></div>

        <div class="add-item-bar" style="flex-wrap:wrap;">
          <input class="input" v-model="newFridgeItemName" @keyup.enter="addFridgeItemManual" placeholder="Nom (ex: yaourts)" style="flex:2;min-width:120px;" />
          <input class="input" type="number" min="0" v-model="newFridgeItemQty" @keyup.enter="addFridgeItemManual" placeholder="Qté" style="flex:1;min-width:70px;" />
          <input class="input" v-model="newFridgeItemUnit" @keyup.enter="addFridgeItemManual" placeholder="Unité" style="flex:1;min-width:70px;" />
          <button class="btn btn-secondary" @click="addFridgeItemManual">+</button>
        </div>
      </section>

      <!-- ============================= TAB: INDISPENSABLES ============================= -->
      <section v-show="activeTab==='indispensables'">
        <div class="section-title" style="margin-top:0;">
          <h2>Les indispensables</h2>
          <span class="count">{{ staplesList.length }}</span>
        </div>
        <p class="text-light" style="font-size:13px;margin-bottom:16px;">
          Les basiques de placard (huile, beurre, sel...) demandés par vos recettes. On part du principe que vous les avez déjà à la maison, donc ils ne polluent pas votre liste de courses.
        </p>

        <div v-if="staplesList.length===0" class="empty-state">
          <span class="emoji">🧂</span>
          <h3>Aucun indispensable pour l'instant</h3>
          <p>Sélectionne des recettes pour voir apparaître les basiques nécessaires.</p>
        </div>

        <div v-for="item in staplesList" :key="item.key" class="staple-item">
          <div class="emoji">🧂</div>
          <div class="item-body">
            <div class="item-name">{{ item.name }}</div>
            <div class="item-source">{{ uniqueSourceTitles(item.sources) }}</div>
          </div>
        </div>
      </section>

      <!-- ============================= TAB: MON COMPTE ============================= -->
      <section v-show="activeTab==='compte'">

        <div v-if="storeMode==='local'" class="setup-banner">
          <b>Mode local :</b> tes données restent sur cet appareil uniquement. Pour partager la liste de courses avec ta/ton partenaire, connecte Supabase (voir README.md fourni avec l'app).
        </div>

        <div class="card">
          <div class="profile-header">
            <div class="avatar">{{ initials }}</div>
            <div>
              <h2>{{ (profile && (profile.first_name+' '+profile.last_name)) || 'Ton profil' }}</h2>
              <p v-if="profile && profile.email">{{ profile.email }}</p>
              <p v-if="profileAge">{{ profileAge }} ans</p>
            </div>
          </div>

          <div class="field">
            <label class="field-label">Prénom</label>
            <input class="input" v-model="profileForm.firstName" />
          </div>
          <div class="field">
            <label class="field-label">Nom</label>
            <input class="input" v-model="profileForm.lastName" />
          </div>
          <div v-if="storeMode==='local'" class="field">
            <label class="field-label">Email</label>
            <input class="input" type="email" v-model="profileForm.email" />
          </div>
          <div class="field">
            <label class="field-label">Date de naissance</label>
            <input class="input" type="date" v-model="profileForm.birthdate" />
          </div>
          <button class="btn btn-primary btn-block" @click="saveProfileForm">Enregistrer</button>
        </div>

        <!-- Famille (Supabase uniquement) -->
        <div class="card mt-16" v-if="storeMode==='supabase'">
          <h2>Famille</h2>

          <template v-if="family">
            <p class="text-light">{{ family.name }}</p>
            <div class="mt-8">
              <label class="field-label">Code d'invitation à partager</label>
              <div class="row-between" style="background:var(--surface-alt);padding:10px 14px;border-radius:12px;">
                <b style="font-family:var(--font-heading);letter-spacing:2px;">{{ family.invite_code }}</b>
                <button class="link-btn" @click="copyInviteCode">Copier</button>
              </div>
            </div>
            <div class="mt-16">
              <label class="field-label">Membres</label>
              <div v-for="m in familyMembers" :key="m.id" class="family-member-row">
                <div class="avatar">{{ (m.first_name||'?')[0] }}{{ (m.last_name||'')[0] }}</div>
                <div>
                  <div class="member-name">{{ m.first_name }} {{ m.last_name }}</div>
                  <div class="member-email">{{ m.email }}</div>
                </div>
                <span v-if="profile && m.id===profile.id" class="you-badge">Toi</span>
              </div>
            </div>
          </template>

          <template v-else>
            <p class="text-light" style="font-size:13px;">Crée une famille ou rejoins celle de ta/ton partenaire pour partager votre liste de courses.</p>
            <div class="field mt-16">
              <label class="field-label">Créer une famille</label>
              <input class="input" v-model="familyNameInput" placeholder="Ex : La famille Dupont" />
              <button class="btn btn-primary btn-block mt-8" @click="handleCreateFamily">Créer notre famille</button>
            </div>
            <div class="field mt-16">
              <label class="field-label">Ou rejoindre avec un code</label>
              <input class="input" v-model="joinCodeInput" placeholder="Ex : A1B2C3" style="text-transform:uppercase;" />
              <button class="btn btn-secondary btn-block mt-8" @click="handleJoinFamily">Rejoindre</button>
              <p v-if="familyError" class="auth-error mt-8">{{ familyError }}</p>
            </div>
          </template>
        </div>

        <button v-if="storeMode==='supabase'" class="btn btn-outline btn-block mt-24" @click="handleSignOut">Se déconnecter</button>
      </section>

    </main>

    <!-- ============================================================ -->
    <!-- Barre d'onglets -->
    <!-- ============================================================ -->
    <nav class="tab-bar">
      <button class="tab-btn" :class="{active: activeTab==='recettes'}" @click="activeTab='recettes'">
        <span class="tab-icon">🍳</span> Recettes
      </button>
      <button class="tab-btn" :class="{active: activeTab==='masemaine'}" @click="activeTab='masemaine'">
        <span class="tab-icon">🗓️</span> Ma semaine
        <span v-if="weekSelections.length" class="badge">{{ weekSelections.length }}</span>
      </button>
      <button class="tab-btn" :class="{active: activeTab==='courses'}" @click="activeTab='courses'">
        <span class="tab-icon">🛒</span> Courses
        <span v-if="shoppingList.length" class="badge">{{ shoppingList.length }}</span>
      </button>
      <button class="tab-btn" :class="{active: activeTab==='frigo'}" @click="activeTab='frigo'">
        <span class="tab-icon">🧊</span> Frigo
        <span v-if="fridgeItemsList.length" class="badge">{{ fridgeItemsList.length }}</span>
      </button>
      <button class="tab-btn" :class="{active: activeTab==='indispensables'}" @click="activeTab='indispensables'">
        <span class="tab-icon">🧂</span> Basiques
      </button>
    </nav>

    <!-- ============================================================ -->
    <!-- Popup recette -->
    <!-- ============================================================ -->
    <div v-if="openTemplateId" class="modal-overlay center-overlay" @click.self="closeTemplateDetail">
      <div class="modal-sheet modal-center">
        <div class="confirm-box">
          <span class="emoji">{{ openTemplate_?.emoji }}</span>
          <h3>{{ openTemplate_?.title }}</h3>
          <p>{{ openTemplate_?.method }}</p>

          <div v-if="openTemplateMatchedItems.length" style="text-align:left;margin-top:14px;">
            <h4 style="font-size:12.5px;text-transform:uppercase;color:var(--text-light);margin-bottom:6px;">Dans ton Frigo</h4>
            <div v-for="grp in openTemplateMatchedItems" :key="grp.category" style="margin-bottom:10px;">
              <div style="font-size:11.5px;font-weight:800;color:var(--teal-dark);margin-bottom:4px;">{{ grp.category }}</div>
              <div class="filter-chips wrap">
                <span v-for="item in grp.items" :key="item.name" class="tag tag-teal">{{ item.name }}</span>
              </div>
            </div>
          </div>

          <button class="btn btn-primary btn-block mt-16" @click="closeTemplateDetail">Fermer</button>
        </div>
      </div>
    </div>

    <div v-if="openRecipeId" class="modal-overlay" @click.self="closeModal">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <button class="modal-close" @click="closeModal">✕</button>

        <div class="recipe-modal-hero" :class="'thumb-' + ((recipeIndex(openRecipeId) % 4) + 1)">
          {{ openRecipe_.emoji }}
          <button class="fav-star" style="top:12px;left:12px;" :class="{active: isFavorite(openRecipeId)}" @click.stop="toggleFavorite(openRecipeId)">{{ isFavorite(openRecipeId) ? '★' : '☆' }}</button>
        </div>

        <div class="recipe-modal-body">
          <h2>{{ openRecipe_.title }}</h2>
          <div class="subtitle">{{ openRecipe_.subtitle }}</div>
          <div class="recipe-modal-meta">
            <span>⏱ {{ openRecipe_.prepMinutes }} min</span>
            <span>👩‍🍳 {{ openRecipe_.difficulty }}</span>
            <span>🔥 {{ openRecipe_.kcal }} kcal/portion</span>
          </div>
          <div class="filter-chips" style="margin-bottom:6px;">
            <span v-for="t in openRecipe_.tags" :key="t" class="tag">{{ t }}</span>
            <span v-if="openRecipe_.isCustom" class="tag tag-teal">Ta recette</span>
          </div>
          <a v-if="openRecipe_.url || openRecipe_.sourceUrl" :href="openRecipe_.url || openRecipe_.sourceUrl" target="_blank" rel="noopener" style="font-size:11.5px;color:var(--teal-dark);font-weight:700;display:inline-block;margin-bottom:10px;">🔗 Source originale</a>

          <div class="servings-stepper">
            <button class="step-btn" :disabled="modalServings<=1" @click="changeServings(-1)">−</button>
            <div class="step-count"><b>{{ modalServings }}</b><small>PORTION{{ modalServings>1?'S':'' }}</small></div>
            <button class="step-btn" :disabled="modalServings>=6" @click="changeServings(1)">+</button>
          </div>

          <h3>Ingrédients</h3>
          <ul>
            <li v-for="ing in modalIngredientsWithFridge" :key="ing.name" class="ingredient-list-row" :class="{'staple-row': ing.isStaple}">
              <span class="qty">{{ formatQty(ing.qty, ing.unit) }}</span>
              <span class="name">{{ ing.name }}</span>
              <span v-if="ing.isStaple" class="tag tag-yellow">basique</span>
              <span v-else-if="ing.hasFridge && ing.fridgeExact && ing.covered" class="tag tag-teal" title="Déjà assez au Frigo">🧊 {{ formatQty(ing.fridgeQty, ing.fridgeUnit) }} au Frigo</span>
              <span v-else-if="ing.hasFridge && ing.fridgeExact" class="tag tag-teal" title="Un peu au Frigo, il en manquera">🧊 {{ formatQty(ing.fridgeQty, ing.fridgeUnit) }} au Frigo</span>
              <span v-else-if="ing.hasFridge" class="tag tag-teal" title="Présent au Frigo, unité différente">🧊 déjà au Frigo</span>
            </li>
          </ul>

          <h3 class="mt-24">Préparation</h3>
          <div v-for="(step,i) in openRecipe_.steps" :key="i" class="step-row">
            <div class="step-num">{{ i+1 }}</div>
            <p>{{ step }}</p>
          </div>
        </div>

        <div class="recipe-modal-actions">
          <button v-if="isSelected(openRecipeId)" class="btn btn-danger btn-block" @click="removeFromWeek">Retirer de ma semaine</button>
          <button v-else class="btn btn-primary btn-block" @click="addToWeekFromModal">Ajouter à ma semaine</button>
          <button class="btn btn-outline btn-block mt-8" @click="openEditRecipe(openRecipeId)">✏️ Modifier la recette</button>
          <button v-if="openRecipe_.isCustom" class="btn btn-ghost btn-block" @click="deleteOpenCustomRecipe">🗑️ Supprimer cette recette</button>
        </div>
      </div>
    </div>

    <!-- ============================================================ -->
    <!-- Confirmation de suppression d'un ingrédient -->
    <!-- ============================================================ -->
    <div v-if="pendingRemoveItem" class="modal-overlay center-overlay" @click.self="cancelRemove">
      <div class="modal-sheet modal-center">
        <div class="confirm-box">
          <span class="emoji">⚠️</span>
          <h3>Retirer "{{ pendingRemoveItem.name }}" ?</h3>
          <p>Cet ingrédient est nécessaire pour : <b>{{ uniqueSourceTitles(pendingRemoveItem.sources) }}</b>. Si tu le retires, il ne sera plus dans ta liste de courses.</p>
          <div class="confirm-actions">
            <button class="btn btn-outline" @click="cancelRemove">Annuler</button>
            <button class="btn btn-danger" @click="confirmRemove">Retirer</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ============================================================ -->
    <!-- Ajouter / importer une recette -->
    <!-- ============================================================ -->
    <div v-if="recipeFormModalOpen" class="modal-overlay" @click.self="closeRecipeFormModal">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <button class="modal-close" @click="closeRecipeFormModal">✕</button>

        <!-- Choix du mode -->
        <div v-if="recipeFormMode==='choice'" style="padding:32px 22px 26px;">
          <h2 class="text-center">Ajouter une recette</h2>
          <p class="text-center text-light" style="font-size:13px;margin-bottom:24px;">Écris-la toi-même ou importe-la automatiquement depuis un site de cuisine.</p>
          <button class="btn btn-primary btn-block mt-8" @click="recipeFormMode='import'">🔗 Importer depuis une URL</button>
          <button class="btn btn-secondary btn-block mt-8" @click="recipeFormMode='manual'">✍️ Écrire moi-même</button>
        </div>

        <!-- Import URL -->
        <div v-else-if="recipeFormMode==='import'" style="padding:22px;">
          <h2>Importer une recette</h2>
          <p class="text-light" style="font-size:13px;margin-bottom:16px;">Colle le lien d'une recette (Marmiton, Cuisine AZ, HelloFresh, 750g...). On récupère automatiquement le titre, les ingrédients et les étapes — vérifie et complète ensuite si besoin.</p>
          <div v-if="storeMode==='local'" class="setup-banner">L'import automatique nécessite Supabase (voir README.md). En local, écris la recette toi-même.</div>
          <template v-else>
            <div class="field">
              <input class="input" v-model="importUrl" placeholder="https://www.marmiton.org/recettes/..." @keyup.enter="handleImportRecipe" />
            </div>
            <div v-if="importError" class="auth-error">{{ importError }}</div>
            <button class="btn btn-primary btn-block" :disabled="importLoading || !importUrl.trim()" @click="handleImportRecipe">
              {{ importLoading ? 'Import en cours...' : 'Importer' }}
            </button>
          </template>
          <button class="link-btn mt-16" @click="recipeFormMode='choice'">← Retour</button>
        </div>

        <!-- Formulaire manuel (aussi utilisé pour éditer une recette existante) -->
        <div v-else-if="recipeFormMode==='manual'" style="padding:22px;">
          <h2>{{ editingRecipeId ? 'Modifier la recette' : (recipeForm.sourceUrl ? 'Vérifie ta recette importée' : 'Nouvelle recette') }}</h2>

          <div class="field mt-16">
            <label class="field-label">Emoji</label>
            <div class="filter-chips">
              <div v-for="e in ['🍽️','🍜','🍝','🍛','🥘','🥗','🌮','🌯','🍲','🥙','🍳','🍕','🥩','🐟','🍚','🥑']" :key="e"
                   class="chip" :class="{active: recipeForm.emoji===e}" @click="pickEmoji(e)" style="font-size:16px;">{{ e }}</div>
            </div>
          </div>

          <div class="field">
            <label class="field-label">Titre</label>
            <input class="input" v-model="recipeForm.title" placeholder="Ex : Curry de légumes au lait de coco" />
          </div>
          <div class="field">
            <label class="field-label">Sous-titre (optionnel)</label>
            <input class="input" v-model="recipeForm.subtitle" placeholder="Ex : riz basmati et coriandre fraîche" />
          </div>

          <div style="display:flex;gap:10px;">
            <div class="field" style="flex:1;">
              <label class="field-label">Portions de base</label>
              <input class="input" type="number" min="1" max="12" v-model="recipeForm.baseServings" />
            </div>
            <div class="field" style="flex:1;">
              <label class="field-label">Temps (min)</label>
              <input class="input" type="number" min="1" v-model="recipeForm.prepMinutes" />
            </div>
          </div>
          <div style="display:flex;gap:10px;">
            <div class="field" style="flex:1;">
              <label class="field-label">Difficulté</label>
              <select class="input" v-model="recipeForm.difficulty">
                <option>Facile</option>
                <option>Moyen</option>
                <option>Avancé</option>
              </select>
            </div>
            <div class="field" style="flex:1;">
              <label class="field-label">Kcal (optionnel)</label>
              <input class="input" type="number" min="0" v-model="recipeForm.kcal" />
            </div>
          </div>

          <div class="field">
            <label class="field-label">Tags</label>
            <div style="position:relative;">
              <input class="input" v-model="recipeTagInput" @keyup.enter="addRecipeFormTag" @focus="onRecipeTagFocus" @blur="onRecipeTagBlur" placeholder="Ex : Poulet, Rapide..." />
              <div v-if="recipeTagInputFocused && recipeTagSuggestions.length" class="dropdown-panel" style="z-index:40;">
                <div v-for="s in recipeTagSuggestions" :key="s" class="dropdown-option" @mousedown.prevent="selectRecipeFormTagSuggestion(s)">
                  🏷️ {{ s }}
                </div>
              </div>
            </div>
            <div v-if="recipeForm.tags.length" class="filter-chips wrap mt-8">
              <div v-for="(t,i) in recipeForm.tags" :key="t" class="chip active" style="display:flex;align-items:center;gap:6px;">
                {{ t }} <span @click="removeRecipeFormTag(i)" style="cursor:pointer;font-weight:900;">✕</span>
              </div>
            </div>
            <p class="text-light" style="font-size:11.5px;margin-top:6px;">Choisis un tag existant dans la liste, ou tape-en un nouveau et appuie sur Entrée.</p>
          </div>

          <h3 class="mt-16">Ingrédients</h3>
          <div v-for="(ing,i) in recipeForm.ingredients" :key="i" style="display:flex;gap:6px;margin-bottom:8px;align-items:center;">
            <input class="input" style="width:64px;flex:none;" type="number" step="0.01" placeholder="Qté" v-model="ing.qty" />
            <select class="input" style="width:88px;flex:none;" v-model="ing.unit">
              <option value="g">g</option><option value="kg">kg</option>
              <option value="ml">ml</option><option value="l">l</option>
              <option value="cs">cs</option><option value="cc">cc</option>
              <option value="pièce">pièce</option><option value="gousse">gousse</option>
              <option value="sachet">sachet</option><option value="bouquet">bouquet</option>
              <option value="branche">branche</option><option value="boîte">boîte</option>
              <option value="au-gout">au goût</option>
            </select>
            <div style="flex:1;position:relative;">
              <input class="input" placeholder="Ingrédient" v-model="ing.name" @focus="onIngredientRowFocus(i)" @blur="onIngredientRowBlur" />
              <div v-if="activeIngredientRowIndex===i && ingredientRowSuggestions(ing.name).length" class="dropdown-panel" style="z-index:40;">
                <div v-for="s in ingredientRowSuggestions(ing.name)" :key="s" class="dropdown-option" @mousedown.prevent="selectIngredientRowSuggestion(i, s)">
                  🔎 {{ s }}
                </div>
              </div>
            </div>
            <button class="remove-x" @click="removeIngredientRow(i)">✕</button>
          </div>
          <button class="link-btn" @click="addIngredientRow">+ Ajouter un ingrédient</button>

          <h3 class="mt-16">Étapes</h3>
          <div v-for="(step,i) in recipeForm.steps" :key="i" style="display:flex;gap:6px;margin-bottom:8px;align-items:flex-start;">
            <div class="step-num" style="margin-top:8px;">{{ i+1 }}</div>
            <textarea class="input" rows="2" v-model="recipeForm.steps[i]" placeholder="Décris cette étape..."></textarea>
            <button class="remove-x" style="margin-top:8px;" @click="removeStepRow(i)">✕</button>
          </div>
          <button class="link-btn" @click="addStepRow">+ Ajouter une étape</button>

          <button class="btn btn-primary btn-block mt-24" @click="saveRecipeForm">Enregistrer la recette</button>
          <button v-if="editingRecipeId && !customRecipes.some(r=>r.id===editingRecipeId) && recipeOverrides[editingRecipeId]"
                  class="btn btn-ghost btn-block" @click="resetRecipeOverride">↺ Rétablir la version d'origine</button>
          <button class="link-btn mt-8" @click="handleFormBack">← {{ editingRecipeId ? 'Annuler' : 'Retour' }}</button>
        </div>
      </div>
    </div>

    <!-- ============================================================ -->
    <!-- Modifier la quantité d'un ingrédient (liste de courses) -->
    <!-- ============================================================ -->
    <div v-if="qtyEditItem" class="modal-overlay center-overlay" @click.self="cancelQtyEdit">
      <div class="modal-sheet modal-center">
        <div class="confirm-box">
          <span class="emoji">✏️</span>
          <h3>Modifier la quantité</h3>
          <p>Pour <b>{{ qtyEditItem.name }}</b>, besoin calculé de {{ formatQty(qtyEditItem.totalQty, qtyEditItem.unit) }}. Quelle quantité vas-tu acheter au total ?</p>
          <div class="field" style="display:flex;gap:8px;align-items:center;justify-content:center;">
            <input class="input" style="width:110px;text-align:center;" type="number" min="0" step="1" v-model="qtyEditInput" @keyup.enter="confirmQtyEdit" autofocus />
            <span class="text-light">{{ qtyEditItem.unit }}</span>
          </div>
          <div class="confirm-actions">
            <button class="btn btn-outline" @click="cancelQtyEdit">Annuler</button>
            <button class="btn btn-primary" @click="confirmQtyEdit">Enregistrer</button>
          </div>
          <button v-if="quantityOverrides[qtyEditItem.key]" class="link-btn mt-8" @click="clearQtyOverride">↺ Revenir au calcul automatique</button>
        </div>
      </div>
    </div>

    <!-- ============================================================ -->
    <!-- Modifier un article ajouté à la main -->
    <!-- ============================================================ -->
    <div v-if="manualEditItem" class="modal-overlay center-overlay" @click.self="cancelManualEdit">
      <div class="modal-sheet modal-center">
        <div class="confirm-box" style="text-align:left;">
          <h3 class="text-center">Modifier l'article</h3>
          <div class="field mt-16">
            <label class="field-label">Nom</label>
            <input class="input" v-model="manualEditForm.name" />
          </div>
          <div style="display:flex;gap:8px;">
            <div class="field" style="flex:1;">
              <label class="field-label">Quantité</label>
              <input class="input" type="number" min="0" v-model="manualEditForm.qty" />
            </div>
            <div class="field" style="flex:1;">
              <label class="field-label">Unité</label>
              <input class="input" v-model="manualEditForm.unit" placeholder="ex: g, pièce..." />
            </div>
          </div>
          <div class="confirm-actions">
            <button class="btn btn-outline" @click="cancelManualEdit">Annuler</button>
            <button class="btn btn-primary" @click="confirmManualEdit">Enregistrer</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ============================================================ -->
    <!-- Modifier un article du Frigo -->
    <!-- ============================================================ -->
    <div v-if="fridgeEditItem" class="modal-overlay center-overlay" @click.self="cancelFridgeEdit">
      <div class="modal-sheet modal-center">
        <div class="confirm-box" style="text-align:left;">
          <h3 class="text-center">Modifier l'article du Frigo</h3>
          <div class="field mt-16">
            <label class="field-label">Nom</label>
            <input class="input" v-model="fridgeEditForm.name" />
          </div>
          <div style="display:flex;gap:8px;">
            <div class="field" style="flex:1;">
              <label class="field-label">Quantité</label>
              <input class="input" type="number" min="0" v-model="fridgeEditForm.qty" />
            </div>
            <div class="field" style="flex:1;">
              <label class="field-label">Unité</label>
              <input class="input" v-model="fridgeEditForm.unit" placeholder="ex: g, pièce..." />
            </div>
          </div>
          <div class="confirm-actions">
            <button class="btn btn-outline" @click="cancelFridgeEdit">Annuler</button>
            <button class="btn btn-primary" @click="confirmFridgeEdit">Enregistrer</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div v-if="toastMessage" class="toast">{{ toastMessage }}</div>

  </template>
</div>

<script type="module" src="/js/main.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
